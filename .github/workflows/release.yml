name: release

# Managed by maelys-release v0.65.1 (0.65.1). Regenerate with
# 'maelys-release adopt' of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag whose release and Homebrew publication are replayed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@c411025b7d9131e693ed5c683b104d3204178e77 # v0.65.1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-jsonrpc
      tag: ${{ inputs.tag || github.ref_name }}
      dependency_checkout: |
        sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      linux_packages: build-essential dpkg-dev file rpm clang libclang-rt-dev cmake pkg-config libjansson-dev python3
      macos_packages: llvm cmake pkg-config jansson

  tap-libmaelys-jsonrpc:
    needs: release
    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@c411025b7d9131e693ed5c683b104d3204178e77 # v0.65.1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: libmaelys-jsonrpc
      tag: ${{ inputs.tag || github.ref_name }}
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
